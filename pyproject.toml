[project]
name = "legion-goes"
version = "0.1.9"
description = "GOES-16/17/18/19 satellite image processor for MAIE Thesis 2026"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "David Elias Panigo", email = "d.eliaspanigo@gmail.com"},
]
keywords = ["goes", "goes-19", "satpy", "s3", "meteorologia", "remotesensing", "legion"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
    "click>=8.1.0",
    "psutil>=5.9.0",
    "s3fs>=2024.12.0",
    "fsspec>=2024.12.0",
    "boto3>=1.34.0",
    "pyyaml>=6.0.1",
    "tqdm>=4.66.0",
    "apscheduler>=3.10.0",
    "xarray>=2024.1.0",
    "netCDF4>=1.6.5",
]
[project.optional-dependencies]
dev = [
    "ruff",
    "black",
    "pytest",
    "pytest-cov",
    "ipykernel",
]
[project.scripts]
LEGION-GOES = "legion_goes.main:cli"

[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

# --- SRC STRUCTURE CONFIGURATION ---
[tool.hatch.build.targets.wheel]
packages = ["legion_goes"]  # ← Apunta directamente a legion_goes/ (sin src/)

[tool.hatch.build.targets.wheel.sources]
"legion_goes" = "legion_goes"  # ← Mapea legion_goes/ a legion_goes/ en el paquete

[tool.hatch.build.targets.sdist]
include = [
    "/legion_goes",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.ruff]
line-length = 88
target-version = "py312"
select = ["E", "F", "W", "I", "PL", "UP", "B", "C4"]
ignore = ["E501"]
